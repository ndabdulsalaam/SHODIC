<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | RxChat</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1a2e;
            color: #e8ecf4;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 480px;
            padding: 2rem;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2ec4b6, #20b2aa);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f1a2e;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e8ecf4;
        }

        .logo-text span {
            color: #2ec4b6;
        }

        .code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e63946, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        p {
            color: #8899b0;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #2ec4b6, #20b2aa);
            color: #0f1a2e;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">Rx</div>
            <div class="logo-text">Rx<span>Chat</span></div>
        </div>
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>Our servers encountered an unexpected error. Please try again in a moment. If the problem persists, contact
            support.</p>
        <a href="/" class="btn">Back to RxChat</a>
    </div>
</body>

</html>
