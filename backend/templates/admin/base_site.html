{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Fildah Admin{% endblock %}

{% block branding %}
<div id="fildah-admin-branding">
    <a class="fildah-admin-logo" href="{% url 'admin:index' %}?project=fildah" aria-label="Fildah admin home">
        <span class="fildah-admin-logo__name">Fildah</span>
        <span class="fildah-admin-logo__tag">Admin</span>
    </a>
    <nav class="fildah-admin-projects" aria-label="Admin project selector">
        {% for project in fildah_admin_projects %}
            <a
                class="fildah-admin-projects__item{% if project.is_active %} fildah-admin-projects__item--active{% endif %}"
                href="{{ project.url }}"
                data-admin-project="{{ project.slug }}"
            >
                {{ project.name }}
            </a>
        {% endfor %}
    </nav>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="icon" type="image/png" href="{% static 'admin/img/rx-favicon.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* ================================================
       Fildah Admin - clean, light theme
       Mirrors the product frontends: white surfaces, subtle
       grey borders, Inter font, teal accent sparingly.
       ================================================ */

    /* Light mode (default) */
    :root {
        --rxc-bg: #F8FAFB;
        --rxc-surface: #FFFFFF;
        --rxc-border: #E2E8F0;
        --rxc-border-light: #F0F4F8;
        --rxc-text: #1A1A2E;
        --rxc-text-secondary: #5A6578;
        --rxc-text-muted: #8E99A8;
        --rxc-accent: #2EC4B6;
        --rxc-accent-dark: #1f9a8e;
        --rxc-error: #E63946;
        --rxc-success: #2ECC71;
        --rxc-admin-header-height: 88px;
        --rxc-admin-breadcrumb-height: 48px;
        --rxc-admin-changelist-header-height: 74px;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
        :root {
            --rxc-bg: #121212;
            --rxc-surface: #1E1E1E;
            --rxc-border: #2E2E2E;
            --rxc-border-light: #252525;
            --rxc-text: #E0E0E0;
            --rxc-text-secondary: #A0A0A0;
            --rxc-text-muted: #707070;
            --rxc-accent: #2EC4B6;
            --rxc-accent-dark: #1f9a8e;
            --rxc-error: #E63946;
            --rxc-success: #2ECC71;
        }
    }

    /* Django admin dark theme toggle support */
    [data-theme="dark"] {
        --rxc-bg: #121212;
        --rxc-surface: #1E1E1E;
        --rxc-border: #2E2E2E;
        --rxc-border-light: #252525;
        --rxc-text: #E0E0E0;
        --rxc-text-secondary: #A0A0A0;
        --rxc-text-muted: #707070;
        --rxc-accent: #2EC4B6;
        --rxc-accent-dark: #1f9a8e;
        --rxc-error: #E63946;
        --rxc-success: #2ECC71;
    }

    /* ── Font ────────────────────────────────────── */
    body,
    #container,
    #header,
    #content,
    .module,
    table,
    th,
    td,
    input,
    select,
    textarea,
    a,
    p,
    label,
    h1,
    h2,
    h3,
    h4,
    .help,
    .btn,
    .breadcrumbs,
    #user-tools {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont,
            'Segoe UI', Roboto, sans-serif !important;
    }

    /* ── Body ────────────────────────────────────── */
    body {
        background: var(--rxc-bg) !important;
    }

    #container {
        min-height: 100dvh;
    }

    /* ── Header — clean white bar ────────────────── */
    #header {
        background: var(--rxc-surface) !important;
        color: var(--rxc-text) !important;
        padding: 14px 24px !important;
        box-shadow: 0 1px 0 var(--rxc-border);
        border-bottom: none;
        position: sticky;
        top: 0;
        z-index: 1000;
        min-height: var(--rxc-admin-header-height);
        box-sizing: border-box;
    }

    #fildah-admin-branding {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
    }

    .fildah-admin-logo {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        text-decoration: none;
    }

    .fildah-admin-logo__name {
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--rxc-text);
    }

    .fildah-admin-logo__tag {
        color: var(--rxc-accent);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
    }

    .fildah-admin-projects {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--rxc-border);
        border-radius: 999px;
        background: var(--rxc-bg);
    }

    .fildah-admin-projects__item {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        color: var(--rxc-text-secondary) !important;
        font-size: 0.78rem;
        font-weight: 700;
        text-decoration: none;
    }

    .fildah-admin-projects__item:hover,
    .fildah-admin-projects__item--active {
        background: var(--rxc-surface);
        color: var(--rxc-text) !important;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* Header links */
    #header a:link,
    #header a:visited {
        color: var(--rxc-text-secondary) !important;
    }

    #header a:hover {
        color: var(--rxc-accent) !important;
    }

    #user-tools {
        font-size: 0.8rem;
        color: var(--rxc-text-muted);
    }

    /* Logout is a <button> in Django 4.1+ — reset to look like a link */
    #user-tools button,
    #user-tools #logout-form button {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        color: var(--rxc-text-secondary) !important;
        font-size: 0.8rem !important;
        font-weight: 400 !important;
        cursor: pointer;
        text-transform: uppercase;
    }

    #user-tools button:hover {
        color: var(--rxc-accent) !important;
    }

    /* ── Breadcrumbs ─────────────────────────────── */
    div.breadcrumbs {
        background: var(--rxc-surface) !important;
        color: var(--rxc-text-muted) !important;
        padding: 8px 24px !important;
        font-size: 0.78rem;
        border-bottom: 1px solid var(--rxc-border) !important;
        position: sticky;
        top: var(--rxc-admin-header-height);
        z-index: 900;
        min-height: var(--rxc-admin-breadcrumb-height);
        box-sizing: border-box;
    }

    div.breadcrumbs a {
        color: var(--rxc-accent) !important;
    }

    /* ── Content ─────────────────────────────────── */
    #content {
        padding: 24px !important;
        min-width: 0;
    }

    #main {
        align-items: flex-start;
    }

    #content h1 {
        font-weight: 600 !important;
        font-size: 1.35rem !important;
        color: var(--rxc-text) !important;
    }

    .rxc-changelist-header {
        position: sticky;
        top: calc(var(--rxc-admin-header-height) + var(--rxc-admin-breadcrumb-height));
        z-index: 870;
        display: grid;
        grid-template-columns: minmax(240px, auto) minmax(340px, 1fr) auto;
        gap: 16px;
        align-items: center;
        background: var(--rxc-bg) !important;
        margin: -24px -24px 16px !important;
        padding: 14px 24px !important;
        border-bottom: 1px solid var(--rxc-border);
        box-sizing: border-box;
        min-height: var(--rxc-admin-changelist-header-height);
    }

    .rxc-changelist-header h1 {
        margin: 0 !important;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .rxc-changelist-search {
        min-width: 0;
    }

    .rxc-changelist-search #toolbar {
        margin: 0 !important;
        padding: 0 !important;
    }

    .rxc-changelist-search #toolbar form {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 620px;
    }

    .rxc-changelist-search #searchbar {
        flex: 1 1 320px;
        min-width: 160px;
        max-width: 480px;
    }

    .rxc-changelist-header .object-tools {
        float: none;
        display: flex;
        justify-content: flex-end;
        margin: 0 !important;
        padding: 0 !important;
        white-space: nowrap;
    }

    /* ── Modules (cards) ─────────────────────────── */
    .module {
        background: var(--rxc-surface) !important;
        border: 1px solid var(--rxc-border) !important;
        border-radius: 8px !important;
        box-shadow: none !important;
        margin-bottom: 16px !important;
    }

    .module h2,
    .module caption {
        background: var(--rxc-bg) !important;
        color: var(--rxc-text) !important;
        font-weight: 600 !important;
        font-size: 0.82rem !important;
        padding: 10px 16px !important;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border-bottom: 1px solid var(--rxc-border) !important;
    }

    /* ── Admin navigation sidebar ───────────────────── */
    #nav-sidebar {
        background: var(--rxc-surface) !important;
        border-right: 1px solid var(--rxc-border) !important;
        position: sticky !important;
        top: calc(var(--rxc-admin-header-height) + var(--rxc-admin-breadcrumb-height)) !important;
        align-self: flex-start;
        max-height: calc(100dvh - var(--rxc-admin-header-height) - var(--rxc-admin-breadcrumb-height));
        overflow-y: auto !important;
        overscroll-behavior: contain;
    }

    #nav-sidebar::-webkit-scrollbar {
        width: 8px;
    }

    #nav-sidebar::-webkit-scrollbar-thumb {
        background: var(--rxc-border);
        border-radius: 999px;
    }

    #nav-sidebar #nav-filter {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--rxc-surface) !important;
        border: 1px solid var(--rxc-border) !important;
        color: var(--rxc-text) !important;
        box-sizing: border-box;
    }

    #nav-sidebar .module {
        background: var(--rxc-surface) !important;
        border: 1px solid var(--rxc-border) !important;
        border-radius: 8px !important;
        overflow: hidden;
    }

    #nav-sidebar .module h2,
    #nav-sidebar .module caption,
    #nav-sidebar caption {
        background: var(--rxc-bg) !important;
        color: var(--rxc-text) !important;
        opacity: 1 !important;
        text-shadow: none !important;
    }

    #nav-sidebar .module th,
    #nav-sidebar .module td {
        background: var(--rxc-surface) !important;
        color: var(--rxc-text) !important;
        border-bottom: 1px solid var(--rxc-border-light) !important;
    }

    #nav-sidebar .module a {
        color: var(--rxc-text) !important;
    }

    #nav-sidebar .module a:hover {
        color: var(--rxc-accent) !important;
    }

    /* ── Tables ───────────────────────────────────── */
    #result_list table thead th,
    #changelist table thead th {
        background: var(--rxc-bg) !important;
        color: var(--rxc-text-secondary) !important;
        font-weight: 600 !important;
        font-size: 0.75rem !important;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 10px 14px !important;
        border-bottom: 1px solid var(--rxc-border) !important;
    }

    #result_list table thead th a,
    #changelist table thead th a {
        color: var(--rxc-text-secondary) !important;
    }

    #result_list table tbody td,
    #changelist table tbody td {
        padding: 10px 14px !important;
        font-size: 0.85rem;
        border-bottom: 1px solid var(--rxc-border-light);
        color: var(--rxc-text);
    }

    #result_list table tbody td a,
    #changelist table tbody td a {
        color: var(--rxc-text) !important;
        font-weight: 500;
    }

    #result_list table tbody td a:hover,
    #changelist table tbody td a:hover {
        color: var(--rxc-accent) !important;
    }

    #result_list table tbody tr:hover,
    #changelist table tbody tr:hover {
        background: var(--rxc-border-light) !important;
    }

    /* Alternating rows */
    #result_list table tbody tr.row1 {
        background: var(--rxc-surface);
    }

    #result_list table tbody tr.row2 {
        background: var(--rxc-bg);
    }

    /* ── Buttons — simple, flat ──────────────────── */
    input[type="submit"],
    .submit-row input,
    a.button,
    .button {
        background: var(--rxc-accent) !important;
        color: #fff !important;
        border: none !important;
        border-radius: 6px !important;
        padding: 8px 18px !important;
        font-weight: 600 !important;
        font-size: 0.82rem !important;
        cursor: pointer;
        transition: background 150ms ease;
    }

    input[type="submit"]:hover,
    .submit-row input:hover,
    a.button:hover,
    .button:hover {
        background: var(--rxc-accent-dark) !important;
    }

    .submit-row .deletelink,
    a.deletelink {
        background: var(--rxc-error) !important;
        color: #fff !important;
        border-radius: 6px !important;
        padding: 8px 18px !important;
    }

    /* ── Submit row ──────────────────────────────── */
    .submit-row {
        background: var(--rxc-bg) !important;
        border-top: 1px solid var(--rxc-border) !important;
        padding: 12px 16px !important;
    }

    /* ── Search bar ──────────────────────────────── */
    #toolbar {
        background: transparent !important;
        border: none !important;
        padding: 0 0 14px 0 !important;
    }

    #searchbar {
        border: 1px solid var(--rxc-border) !important;
        border-radius: 6px !important;
        padding: 8px 12px !important;
        font-size: 0.85rem !important;
        background: var(--rxc-surface) !important;
        transition: border-color 150ms ease;
    }

    #searchbar:focus {
        border-color: var(--rxc-accent) !important;
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(46, 196, 182, 0.12) !important;
    }

    /* ── Form fields ─────────────────────────────── */
    .form-row input[type="text"],
    .form-row input[type="email"],
    .form-row input[type="url"],
    .form-row input[type="password"],
    .form-row input[type="number"],
    .form-row select,
    .form-row textarea {
        border: 1px solid var(--rxc-border) !important;
        border-radius: 6px !important;
        padding: 8px 12px !important;
        font-size: 0.85rem;
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
        border-color: var(--rxc-accent) !important;
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(46, 196, 182, 0.12) !important;
    }

    /* ── Sidebar filter ──────────────────────────── */
    #changelist-filter {
        background: var(--rxc-surface) !important;
        border: 1px solid var(--rxc-border);
        border-radius: 8px;
        position: sticky;
        top: calc(var(--rxc-admin-header-height) + var(--rxc-admin-breadcrumb-height) + var(--rxc-admin-changelist-header-height) + 12px);
        align-self: flex-start;
        max-height: calc(100dvh - var(--rxc-admin-header-height) - var(--rxc-admin-breadcrumb-height) - var(--rxc-admin-changelist-header-height) - 24px);
        overflow-y: auto;
        overscroll-behavior: contain;
    }

    #changelist-filter h2 {
        background: none !important;
        color: var(--rxc-text) !important;
        font-size: 0.8rem !important;
        padding: 12px 16px 4px !important;
        border-bottom: none !important;
    }

    #changelist-filter h3 {
        color: var(--rxc-text-secondary) !important;
        font-weight: 600 !important;
        font-size: 0.78rem !important;
    }

    #changelist-filter li.selected a {
        color: var(--rxc-accent) !important;
        font-weight: 600;
    }

    /* ── Object tools ────────────────────────────── */
    .object-tools a {
        background: var(--rxc-text) !important;
        color: #fff !important;
        border-radius: 6px !important;
        padding: 6px 12px !important;
        font-size: 0.75rem !important;
        font-weight: 600 !important;
    }

    .object-tools a:hover {
        background: var(--rxc-text-secondary) !important;
    }

    /* ── Links ────────────────────────────────────── */
    a:link,
    a:visited {
        color: var(--rxc-text);
    }

    a:hover {
        color: var(--rxc-accent);
    }

    #content a:link,
    #content a:visited {
        color: var(--rxc-text);
    }

    #content a:hover {
        color: var(--rxc-accent);
    }

    @media (max-width: 980px) {
        :root {
            --rxc-admin-changelist-header-height: 148px;
        }

        .rxc-changelist-header {
            grid-template-columns: 1fr;
            gap: 10px;
            align-items: stretch;
        }

        .rxc-changelist-header h1 {
            white-space: normal;
        }

        .rxc-changelist-search #toolbar form {
            max-width: none;
        }

        .rxc-changelist-search #searchbar {
            max-width: none;
        }

        .rxc-changelist-header .object-tools {
            justify-content: flex-start;
        }
    }

    /* ── Messages ────────────────────────────────── */
    .messagelist li {
        border-radius: 6px;
        padding: 10px 16px !important;
        font-size: 0.85rem;
        font-weight: 500;
    }

    .messagelist li.success {
        background: rgba(46, 204, 113, 0.1) !important;
        color: var(--rxc-success) !important;
        border-left: 3px solid var(--rxc-success) !important;
    }

    .messagelist li.error {
        background: rgba(230, 57, 70, 0.1) !important;
        color: var(--rxc-error) !important;
        border-left: 3px solid var(--rxc-error) !important;
    }

    /* ── Login page ──────────────────────────────── */
    body.login {
        background: var(--rxc-bg) !important;
    }

    body.login #content {
        background: var(--rxc-surface);
        border: 1px solid var(--rxc-border);
        border-radius: 10px;
        padding: 28px !important;
        max-width: 400px;
        margin: 40px auto;
    }

    body.login .submit-row input[type="submit"] {
        width: 100%;
        padding: 10px !important;
    }

    /* ── Help text ───────────────────────────────── */
    .help {
        color: var(--rxc-text-muted) !important;
        font-size: 0.78rem !important;
    }

    /* ── Pagination ──────────────────────────────── */
    .paginator a:link,
    .paginator a:visited {
        color: var(--rxc-accent) !important;
    }

    /* ── Dark mode: override Django built-in colors ── */
    @media (prefers-color-scheme: dark) {
        #header {
            box-shadow: 0 1px 0 var(--rxc-border);
        }

        #searchbar {
            color: var(--rxc-text) !important;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {
            color: var(--rxc-text) !important;
            background: var(--rxc-surface) !important;
        }

        .fildah-admin-logo__name {
            color: var(--rxc-text) !important;
        }
    }

    [data-theme="dark"] #header {
        box-shadow: 0 1px 0 var(--rxc-border);
    }

    [data-theme="dark"] #searchbar {
        color: var(--rxc-text) !important;
    }

    [data-theme="dark"] .form-row input,
    [data-theme="dark"] .form-row select,
    [data-theme="dark"] .form-row textarea {
        color: var(--rxc-text) !important;
        background: var(--rxc-surface) !important;
    }

    [data-theme="dark"] .fildah-admin-logo__name {
        color: var(--rxc-text) !important;
    }

    /* ── Theme toggle button — no background ─────── */
    .theme-toggle {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        padding: 4px !important;
    }

    /* ── Header links readable in dark mode ──────── */
    @media (prefers-color-scheme: dark) {

        #user-tools,
        #user-tools a:link,
        #user-tools a:visited {
            color: var(--rxc-text-secondary) !important;
        }

        #user-tools a:hover {
            color: var(--rxc-accent) !important;
        }
    }

    [data-theme="dark"] #user-tools,
    [data-theme="dark"] #user-tools a:link,
    [data-theme="dark"] #user-tools a:visited {
        color: var(--rxc-text-secondary) !important;
    }

    [data-theme="dark"] #user-tools a:hover {
        color: var(--rxc-accent) !important;
    }
</style>
{% endblock %}
